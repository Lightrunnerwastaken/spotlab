[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotlab"
version = "0.1.0"
description = "Spot programmieren an der Kantonsschule"
requires-python = ">=3.11"
dependencies = [
    "bosdyn-client==5.0.1.2",
    "bosdyn-api==5.0.1.2",
    "keyring>=24",
    "numpy>=1.26",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gui = ["PySide6>=6.6", "pygments>=2.17", "jedi>=0.19"]
# >=2.0: dort heisst der Server MCPServer, in 1.x hiess er FastMCP und lag
# unter mcp.server.fastmcp. Ein Kompatibilitaetspfad waere hier ungeprueft.
mcp = ["mcp>=2.0"]

[project.scripts]
spotlab = "spotlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spotlab.workshop" = ["templates/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
